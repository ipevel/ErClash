name: pr

# PR 门禁：静态分析 + 单元测试（不产出构建产物）
# 发版级全平台构建由 build.yaml 在 tag push 时执行

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.27.x'

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Go 与 Rust 供构建钩子使用：flutter test 会编译内核与原生库
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-pr-${{ hashFiles('**/pubspec.lock') }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        # platform 标签：需要真实平台插件或平台渲染的用例，CI 上跳过
        run: flutter test --exclude-tags=platform
